version: '3.8'

services:
  # psql
  postgres:
    image: postgres:15-bookworm
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ctf_db
      POSTGRES_USER: ctf_user
      POSTGRES_PASSWORD: cpsec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql

      #redis
  redis:
    image: redis:7-bookworm
    container_name: redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # postgres to redis Sync Worker
  sync_worker:
    build: ./dbSynch     
    container_name: sync_worker
    restart: always
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  redisdata:

